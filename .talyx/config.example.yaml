# Talyx — workspace config
#
# Copy to `.talyx/config.yaml` and replace with your own. Everything is optional;
# skills use documented defaults for anything absent and never invent a value.
# `/talyx-setup` writes this for you from a completed scoping sheet.
#
# Below is one real example — a wealth manager producing quarterly client packs.
# Yours will look nothing like it. The shape is the same.

org_name: "Ridgeline Private Wealth"
org_description: "Fee-only fiduciary advisory. Not a broker-dealer."
tone: "Plain and factual. No salesmanship. Never imply a future return."

terminology:
  customer: "client"
  portfolio: "household"

people:
  - { name: "Marguerite Oyelaran", role: "Senior Advisor", owns: "pack assembly" }
  - { name: "Compliance",          role: "Compliance",     owns: "sign-off" }
escalate_to: ["Marguerite Oyelaran", "Compliance"]
rule_authority: ["Compliance"]

inputs:
  - { name: "custodian data", from: "Orion", provides: ["holdings", "performance", "fees"] }
  - { name: "meeting dates",  from: "Redtail", provides: ["household", "meeting date"] }

sources:
  - { path: "Orion", holds: "system of record for all figures", authoritative: true }
  - { path: "Model Targets Q3.xlsx", holds: "target allocations" }
  - { path: "Compliance/Approved Language.docx", holds: "disclosure text" }

for_each: "household"

rules:
  - { rule: "Every figure must trace to Orion", because: "it is the system of record" }
  - { rule: "Approved disclosure text is used verbatim", because: "regulator-approved" }
  - { rule: "Correctness beats the deadline", beats: "quarter-end deadline" }

verify:
  - { check: "every figure",     against: "Orion",              match: "to the cent" }
  - { check: "allocation drift", against: "Model Targets Q3.xlsx", match: "exact" }

never_decide:
  - "whether drift warrants a rebalance"
never_produce:
  - "a recommendation, projection, or performance forecast"
protected:
  - "approved disclosure language — not one comma"
confidential:
  - "other households' holdings, returns or fees"

review_required: true
reviewers:
  - { checks: "the whole pack", who: "Compliance", required_by: "regulator, not internal preference" }

destination:
  - { to: "talyx-output/packs", kind: "folder" }

deadline:
  - { what: "packs delivered", when: "10 business days after quarter close", set_by: "internal" }

on_check_failed: stop
