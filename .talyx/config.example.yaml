# Talyx — workspace config
#
# Copy to `.talyx/config.yaml` and replace with your own. Everything is optional;
# skills use documented defaults for anything absent and never invent a value.
# `/talyx-setup` writes this for you from a completed scoping sheet.
#
# Below is one real-shaped example — a commercial insurance brokerage preparing
# policy renewal proposals. Yours will look nothing like it. The shape is the same.

org_name: "Northgate Commercial Insurance"
org_description: "Independent commercial lines brokerage. We place cover; we do not underwrite it."
tone: "Plain and specific. Name the carrier, the limit and the premium. No hedging."

terminology:
  customer: "insured"
  quote: "proposal"

people:
  - { name: "Rosa Delgado",   role: "Account Manager",    owns: "renewal proposals" }
  - { name: "Jim Hartley",    role: "Principal / Broker", owns: "final review before anything goes to an insured" }
escalate_to: ["Rosa Delgado", "Jim Hartley"]
rule_authority: ["Jim Hartley"]

inputs:
  - { name: "carrier renewal terms", from: "carrier portals (email PDFs)", provides: ["limits", "premium", "exclusions"] }
  - { name: "expiring policy",       from: "Applied Epic",                  provides: ["current limits", "endorsements", "claims history"] }

sources:
  - { path: "Applied Epic", holds: "policy of record for every insured", authoritative: true }
  - { path: "Renewals 2026/Carrier Terms", holds: "this year's quotes, one folder per insured" }
  - { path: "Templates/Proposal Cover Letter.docx", holds: "the approved cover letter" }

for_each: "insured"

rules:
  - { rule: "Every limit and premium in the proposal matches the carrier's written terms", because: "the carrier's PDF is what binds" }
  - { rule: "Show the expiring and the renewal side by side, always", because: "insureds ask 'what changed'" }
  - { rule: "Never drop an exclusion from the summary to make the renewal look better", beats: "keeping the proposal to one page" }

verify:
  - { check: "every limit and premium", against: "the carrier's renewal terms PDF", match: "exact" }
  - { check: "expiring limits",         against: "Applied Epic",                   match: "exact" }

never_decide:
  - "which carrier's terms to recommend when two are close"
never_produce:
  - "a binding confirmation or anything that reads as bound cover"
protected:
  - "the carrier's exclusion wording — quote it, never paraphrase it"
confidential:
  - "other insureds' premiums and loss runs"

review_required: true
reviewers:
  - { checks: "the whole proposal", who: "Jim Hartley", required_by: "internal — the principal signs every proposal" }

destination:
  - { to: "talyx-output/renewals", kind: "folder" }

deadline:
  - { what: "proposal to the insured", when: "30 days before the policy expiry date", set_by: "internal" }

on_check_failed: stop
